services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simplyfile-app:latest
    ports:
      - "9091:8080"
    depends_on:
      - postgres
      - redis
    environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simplyfile
        SPRING_DATASOURCE_USERNAME: simplyfile
        SPRING_DATASOURCE_PASSWORD: 123456
        SPRING_REDIS_HOST: redis
        SPRING_REDIS_PORT: 6379
        SPRING_REDIS_PASSWORD: 123456
    volumes:
      - ./storage:/app/storage


  postgres:
    image: postgres:12.2
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: simplyfile
      POSTGRES_DB: simplyfile

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6.0.6
    environment:
      REDIS_PASSWORD: 123456
    ports:
      - "6379:6379"

volumes:
  postgres-data:

networks:
    simplyfile_network: