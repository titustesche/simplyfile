services:
  postgres:
    image: postgres:12.2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_USER: simplyfile
      POSTGRES_DB: simplyfile

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6.0.6
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: 123456

volumes:
  postgres-data: