# End-to-end tests run against an in-memory database instead of PostgreSQL.
# storage.path is set per test run to a temporary directory (see AbstractE2ETest).
spring.datasource.url=jdbc:h2:mem:simplyfile-e2e;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
