<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dateien', '/css/files.css')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('files')}"></aside>

    <main class="main panel">
        <div class="pageHead">
            <h1 class="pageTitle">Meine Dateien</h1>
            <div class="muted small"><span th:text="${#lists.size(files)}">0</span> Dateien</div>
        </div>

        <label for="fileInput" id="dropzone" class="dropzone">
            <input id="fileInput" type="file" multiple class="visuallyHidden">
            <span id="dropzoneTitle" class="dropzoneTitle">Dateien hierher ziehen</span>
            <span class="muted small">oder <span class="accent">Computer durchsuchen</span></span>
        </label>

        <div class="searchBar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <label for="fileSearch" class="visuallyHidden">Dateien durchsuchen</label>
            <input id="fileSearch" type="search" placeholder="Dateien durchsuchen …" autocomplete="off">
            <button id="sortButton" type="button" class="sortButton">Name A–Z</button>
        </div>

        <div id="fileList" class="fileList">
            <p id="emptyState" class="emptyState muted"
               th:hidden="${!#lists.isEmpty(files)}">Noch keine Dateien – zieh etwas in das Feld oben.</p>

            <div class="fileRow" th:each="file : ${files}"
                 th:attr="data-name=${file.filename},data-size=${file.size}">
                <a class="fileName" th:href="@{/file/{id}(id=${file.id})}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5"></path></svg>
                    <span th:text="${file.filename}">datei.pdf</span>
                </a>
                <div class="muted small" data-bytes th:text="${file.size}">0</div>
                <div class="muted small fileType" th:text="${file.type}">type</div>
                <div class="fileActions">
                    <button type="button" class="btn btnGhost" data-copy
                            th:attr="data-link=@{/file/{id}(id=${file.id})}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4"></path><path d="M8.2 13.2l7.6 4.4"></path></svg>
                        <span>Link kopieren</span>
                    </button>
                    <a class="btn btnSolid" th:href="@{/file/{id}/download(id=${file.id})}">Herunterladen</a>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/format.js}"></script>
<script th:src="@{/js/files.js}"></script>
</body>
</html>
