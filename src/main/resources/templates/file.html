<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${file.filename}, '/css/file.css')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar('file')}"></aside>

    <main class="main panel">
        <div class="pageHead">
            <h1 class="pageTitle fileTitle" th:text="${file.filename}">datei.pdf</h1>
        </div>

        <div class="fileCard">
            <dl class="fileMeta">
                <div>
                    <dt class="eyebrow">Größe</dt>
                    <dd data-bytes th:text="${file.size}">0</dd>
                </div>
                <div>
                    <dt class="eyebrow">Typ</dt>
                    <dd th:text="${file.type}">type</dd>
                </div>
                <div class="wide">
                    <dt class="eyebrow">SHA-256</dt>
                    <dd class="hash" th:text="${file.sha256}">hash</dd>
                </div>
            </dl>
            <a class="btn btnSolid downloadButton" th:href="@{/file/{id}/download(id=${file.id})}">Herunterladen</a>
        </div>
    </main>
</div>
<script th:src="@{/js/format.js}"></script>
</body>
</html>
