<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/Styles/index.css" rel="stylesheet">
    <link href="/Styles/Modal.css" rel="stylesheet">
    <link href="/Styles/TextInput.css" rel="stylesheet">
    <link href="/Styles/Popup.css" rel="stylesheet">
    <link href="/Styles/Button.css" rel="stylesheet">
    <link href="/Styles/Sidebar.css" rel="stylesheet">
    <link href="/Styles/Header.css" rel="stylesheet">
    <link href="/Styles/Message.css" rel="stylesheet">
    <link href="/Styles/PageLayout.css" rel="stylesheet">
    <link href="/Styles/ContextMenu.css" rel="stylesheet">
    <link href="/Styles/Simplyfile.css" rel="stylesheet">
    <script src="/index.js" type="module"></script>
    <title>Simplyfile</title>
</head>
    <body>
    <div id="popup-container"></div>
        <div id="layout-grid">
            <div class="header main-layout">
                <p class="title">Simplyfile</p>
                <div id="accent-color-picker-container">
                    <input type="color" id="accent-color-picker">
                </div>
            </div>
            <div id="sidebar" class="sidebar main-layout"><p class="title">Menü</p></div>
            <div id="main-container" class="main main-layout">
                <div id="overview" class="overview">
                    <div class="page-head">
                        <h1 class="title">Meine Dateien</h1>
                        <p id="file-count" class="muted-text"></p>
                    </div>

                    <label id="dropzone" class="dropzone" for="upload-file-input">
                        <input id="upload-file-input" type="file" multiple hidden>
                        <span class="icon-container dropzone-icon" id="dropzone-icon"></span>
                        <span class="dropzone-title" id="dropzone-title">Dateien hierher ziehen</span>
                        <span class="muted-text">oder <span class="accent-text">Computer durchsuchen</span> · mehrere Dateien möglich</span>
                    </label>

                    <div id="upload-list" class="upload-list"></div>

                    <div id="file-filter" class="file-filter"></div>
                    <div id="file-list" class="file-list"></div>
                </div>
                <div id="details" class="details"></div>
            </div>
        </div>
    </body>
</html>
